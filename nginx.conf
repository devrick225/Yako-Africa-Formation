server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version.txt {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Les ressources Vite ont normalement un nom contenant une empreinte.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Les routes React sont résolues par le navigateur.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
