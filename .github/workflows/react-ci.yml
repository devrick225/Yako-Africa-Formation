name: React Vite CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: react-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    name: Build et verification HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Construire l’image React
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" -t react-render:test .
      - name: Vérifier la configuration Nginx
        run: docker run --rm react-render:test nginx -t
      - name: Vérifier la page, le point de santé, la version et une route React
        run: |
          docker run -d --name react-render-ci -p 127.0.0.1:18088:10000 react-render:test
          trap 'docker logs react-render-ci; docker rm -f react-render-ci >/dev/null 2>&1 || true' EXIT
          READY=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18088/health >/dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          curl -fsS --max-time 5 http://127.0.0.1:18088/ > /tmp/index.html
          test -s /tmp/index.html
          test "$(curl -fsS --max-time 5 http://127.0.0.1:18088/version.txt)" = "$GITHUB_SHA"
          curl -fsS --max-time 5 http://127.0.0.1:18088/route-de-verification > /tmp/route.html
          cmp /tmp/index.html /tmp/route.html
